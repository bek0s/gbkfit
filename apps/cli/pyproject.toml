[build-system]
requires = ['setuptools>=77', 'setuptools-scm>=8']
build-backend = 'setuptools.build_meta'

[project]
name = 'gbkfit-cli'
dynamic = ['version']
description = 'The command-line tool of GBKFIT'
readme = 'README.rst'
license = 'BSD-3-Clause'
authors = [{ name = 'Georgios Bekiaris', email = 'gbkfit@gmail.com' }]
requires-python = '>=3.12'
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy'
]
dependencies = ['gbkfit']

[project.urls]
Homepage = 'https://github.com/bek0s/gbkfit'
Documentation = 'https://gbkfit.readthedocs.io'

[project.scripts]
gbkfit-cli = 'gbkfit_cli.cli:main'

[dependency-groups]
test = ['pytest>=8']

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
addopts = ['-ra', '--strict-markers', '--strict-config']
xfail_strict = true

# The version of the repository (that of gbkfit too)
[tool.setuptools_scm]
root = '../..'
