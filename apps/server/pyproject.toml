[build-system]
requires = ['setuptools>=77', 'setuptools-scm>=8']
build-backend = 'setuptools.build_meta'

[project]
name = 'gbkfit-server'
dynamic = ['version']
description = 'The server of GBKFIT: projects, runs, jobs and live sessions over HTTP'
readme = 'README.rst'
license = 'BSD-3-Clause'
authors = [{ name = 'Georgios Bekiaris', email = 'gbkfit@gmail.com' }]
requires-python = '>=3.12'
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Web Environment',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy'
]
dependencies = ['gbkfit', 'fastapi>=0.135', 'uvicorn[standard]']

[project.urls]
Homepage = 'https://github.com/bek0s/gbkfit'
Documentation = 'https://gbkfit.readthedocs.io'

[project.scripts]
gbkfit-server = 'gbkfit_server.main:main'

[dependency-groups]
test = ['pytest>=8', 'httpx2']

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
addopts = ['-ra', '--strict-markers', '--strict-config']
xfail_strict = true

# The version of the repository (that of gbkfit too)
[tool.setuptools_scm]
root = '../..'
