[build-system]
requires = ['scikit-build-core>=1.1', 'nanobind>=3.1', 'setuptools-scm>=8']
build-backend = 'scikit_build_core.build'

[project]
name = 'gbkfit'
dynamic = ['version']
description = 'Galaxy kinematic modelling and fitting'
readme = 'README.rst'
license = 'BSD-3-Clause'
license-files = ['LICENSE']
authors = [{ name = 'Georgios Bekiaris', email = 'gbkfit@gmail.com' }]
requires-python = '>=3.12'
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: C++',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy'
]
dependencies = [
    'astropy',
    'matplotlib',
    'numpy',
    'pandas',
    'ruamel.yaml',
    'scikit-image',
    'scipy'
]

[project.optional-dependencies]
cuda = ['cupy-cuda12x']
dynesty = ['dynesty']
emcee = ['emcee']
lmfit = ['lmfit']
gui = ['PySide6']

[project.urls]
Homepage = 'https://github.com/bek0s/gbkfit'
Documentation = 'https://gbkfit.readthedocs.io'

[project.scripts]
gbkfit-cli = 'gbkfit.apps.cli:main'

[project.gui-scripts]
gbkfit-gui = 'gbkfit.apps.gui:main'

[dependency-groups]
test = ['pytest>=8', 'pytest-regressions']
dev = [{ include-group = 'test' }]

[tool.scikit-build]
minimum-version = 'build-system.requires'
build-dir = 'build/{wheel_tag}'
wheel.packages = ['src/gbkfit']
wheel.py-api = 'cp312'
sdist.include = ['src/gbkfit/_version.py']

[[tool.dynamic-metadata]]
provider = 'scikit_build_core.metadata.setuptools_scm'

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
addopts = ['-ra', '--strict-markers', '--strict-config']
xfail_strict = true
markers = ['cuda: needs the cuda driver and a CUDA GPU']

[tool.cibuildwheel]
# The wheels use the stable ABI (abi3): each one is built on Python 3.12
# and then reused, and tested, on every later Python version listed here.
build = ['cp312-*', 'cp313-*', 'cp314-*']
skip = ['*-musllinux_*']
archs = ['auto64']
test-groups = ['test']
test-sources = ['tests', 'pyproject.toml']
test-command = 'pytest tests -m "not cuda"'
test-environment = { GBKFIT_REQUIRE_DRIVERS = 'host' }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = '14.0' }

# Linux and Windows wheels also include the cuda module (built with
# CUDA 12.9 for Pascal to Blackwell GPUs, plus PTX for newer ones). It
# only needs the NVIDIA driver and CuPy (the 'cuda' extra) at run time.
[tool.cibuildwheel.linux]
before-all = '''
dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/$(uname -m | sed s/aarch64/sbsa/)/cuda-rhel8.repo
dnf install -y cuda-nvcc-12-9 cuda-cudart-devel-12-9
'''
environment = { CUDACXX = '/usr/local/cuda-12.9/bin/nvcc' }
config-settings = { 'cmake.define.GBKFIT_CUDA' = 'ON', 'cmake.define.CMAKE_CUDA_ARCHITECTURES' = '60-real;70-real;75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual' }
test-command = [
    'pytest tests -m "not cuda"',
    'python -c "import gbkfit.driver.native._cuda"',
]

[tool.cibuildwheel.windows]
config-settings = { 'cmake.define.GBKFIT_CUDA' = 'ON', 'cmake.define.CMAKE_CUDA_ARCHITECTURES' = '60-real;70-real;75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual' }
test-command = [
    'pytest tests -m "not cuda"',
    'python -c "import gbkfit.driver.native._cuda"',
]

[tool.ruff.lint]
# Linting only (no automatic formatting for now): the core pyflakes and
# pycodestyle error rules. Star imports are used on purpose.
select = ['E4', 'E7', 'E9', 'F']
ignore = ['F403', 'F405']

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']

[tool.setuptools_scm]
version_file = 'src/gbkfit/_version.py'
version_file_template = '__version__ = "{version}"'
