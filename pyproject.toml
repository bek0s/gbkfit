[build-system]
requires = ['scikit-build-core>=1.1', 'nanobind>=3.1', 'setuptools-scm>=8']
build-backend = 'scikit_build_core.build'

[project]
name = 'gbkfit'
dynamic = ['version']
description = 'Galaxy kinematic modelling and fitting'
readme = 'README.rst'
license = 'BSD-3-Clause AND MIT'
license-files = [
    'LICENSE',                                     # BSD-3-Clause
    'src/native/third_party/dnest4/LICENSE',       # MIT
    'src/native/third_party/nanobind/LICENSE',     # BSD-3-Clause
    'src/native/third_party/pocketfft/LICENSE.md'  # BSD-3-Clause
]
authors = [{ name = 'Georgios Bekiaris', email = 'gbkfit@gmail.com' }]
requires-python = '>=3.12'
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Environment :: GPU :: NVIDIA CUDA :: 12',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: C++',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering :: Astronomy'
]
dependencies = [
    'annotated-types',
    'asdf',
    'astropy',
    'gwcs',
    'numpy>=2.5',
    'pydantic>=2',
    'rich',
    'ruamel.yaml',
    'scipy',
    'threadpoolctl'
]

[project.optional-dependencies]
plot = ['corner', 'matplotlib']
cuda = ['cupy-cuda12x']
# Transforms of visibilities, on CPUs and on GPUs
cufinufft = ['cufinufft>=2.5']
finufft = ['finufft>=2.5']
casacore = ['python-casacore']
# The JWST datamodels and their transforms, not the pipeline
jwst = ['stdatamodels']
# Fitters
cmaes = ['cma']
dynesty = ['dynesty']
emcee = ['emcee']
lmfit = ['lmfit']
nautilus = ['nautilus-sampler']
ultranest = ['ultranest']
zeus = ['zeus-mcmc']
# Cluster workers
dask = ['distributed']
mpi = ['mpi4py']
ray = ['ray']

[project.urls]
Homepage = 'https://github.com/bek0s/gbkfit'
Documentation = 'https://gbkfit.readthedocs.io'
Issues = 'https://github.com/bek0s/gbkfit/issues'

[dependency-groups]
test = [
    'pytest>=9', 'pytest-regressions', 'pytest-xdist',
    # For the tests of the plot task
    'corner', 'matplotlib',
    # For the tests of the configuration schema
    'jsonschema']
docs = ['sphinx', 'numpydoc', 'pydata-sphinx-theme']
# What builds GBKFIT, as build-system.requires, for an editable install
# without build isolation, which rebuilds only what changed (see the docs)
build = [
    'scikit-build-core>=1.1', 'nanobind>=3.1', 'setuptools-scm>=8', 'cmake',
    'ninja']
# All of the above, plus ruff, the code checker that CI also runs
dev = [
    { include-group = 'test' }, { include-group = 'docs' },
    { include-group = 'build' }, 'ruff']

[tool.scikit-build]
minimum-version = 'build-system.requires'
build-dir = 'build/{wheel_tag}'
wheel.packages = ['src/gbkfit']
wheel.py-api = 'cp312'
sdist.include = ['src/gbkfit/_version.py']
# The apps are packages of their own.
sdist.exclude = ['apps/']

[[tool.dynamic-metadata]]
provider = 'scikit_build_core.metadata.setuptools_scm'

[tool.setuptools_scm]
version_file = 'src/gbkfit/_version.py'
version_file_template = '__version__ = "{version}"'

[tool.pytest]
minversion = '9.0'
testpaths = ['tests']
# Tests run on one worker per core, at most 8; -n 0 runs them in one.
addopts = ['-ra', '-n', 'auto', '--maxprocesses', '8']
# Unknown markers and options, xfails that pass and repeated test ids
# are errors.
strict = true
# Deprecated APIs fail the tests.
filterwarnings = [
    'error::DeprecationWarning',
    'error::PendingDeprecationWarning',
    'error::FutureWarning',
]
markers = [
    'cuda: needs the cuda driver and a CUDA GPU',
    'slow: takes seconds (e.g. full fits by samplers); run with --runslow',
]

[tool.cibuildwheel]
# The wheels use the stable ABI (abi3): each one is built on Python 3.12
# and then reused, and tested, on every later Python version listed here.
build = ['cp312-*', 'cp313-*', 'cp314-*']
skip = ['*-musllinux_*']
archs = ['auto64']
test-groups = ['test']
test-sources = ['tests', 'pyproject.toml']
test-command = 'pytest tests -m "not cuda"'
test-environment = { GBKFIT_REQUIRE_DRIVERS = 'host' }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = '14.0' }

# Linux and Windows wheels also include the cuda module (built with
# CUDA 12.9 for Pascal to Blackwell GPUs, plus PTX for newer ones). It
# only needs the NVIDIA driver and CuPy (the 'cuda' extra) at run time.
[[tool.cibuildwheel.overrides]]
select = ['*-manylinux_*', '*-win_*']
config-settings = { 'cmake.define.GBKFIT_CUDA' = 'ON', 'cmake.define.CMAKE_CUDA_ARCHITECTURES' = '60-real;70-real;75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual' }
test-command = [
    'pytest tests -m "not cuda"',
    'python -c "import gbkfit.driver.drivers.cuda._cuda"',
]

# Linux wheels are built inside a container, so CUDA is installed in it
# here. (Windows has no container: the CI workflow installs CUDA there.)
[tool.cibuildwheel.linux]
before-all = '''
dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/$(uname -m | sed s/aarch64/sbsa/)/cuda-rhel8.repo
dnf install -y cuda-nvcc-12-9 cuda-cudart-devel-12-9
'''
environment = { CUDACXX = '/usr/local/cuda-12.9/bin/nvcc' }

[tool.pyright]
# Only the use of deprecated APIs is checked (no type checking yet), as
# of the newest Python the wheels support. CI does not install the
# packages, so only the deprecations of Python itself are checked there.
include = ['src', 'apps']
pythonVersion = '3.14'
typeCheckingMode = 'off'
reportDeprecated = 'error'
reportMissingImports = false
reportInvalidTypeForm = false

[tool.ruff.lint]
# Lint only, no formatting. Checks: errors, type hints on every function,
# a docstring on every module and public function, and a sorted __all__.
# Star imports are used on purpose.
select = ['E4', 'E7', 'E9', 'F', 'ANN', 'D100', 'D103', 'RUF022']
ignore = ['F403', 'F405', 'ANN204', 'ANN401']

[tool.ruff.lint.per-file-ignores]
# Imports in __init__.py re-export names, so they aren't unused
'__init__.py' = ['F401']
# Tests and the apps don't need type hints or docstrings
'tests/**' = ['ANN', 'D100', 'D103']
'apps/**' = ['ANN', 'D100', 'D103']
