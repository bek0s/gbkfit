[build-system]
requires = ['scikit-build-core>=1.1', 'pybind11>=3.0', 'setuptools-scm>=8']
build-backend = 'scikit_build_core.build'

[project]
name = 'gbkfit'
dynamic = ['version']
description = 'Galaxy kinematic modelling and fitting'
readme = 'README.rst'
license = 'BSD-3-Clause'
license-files = ['LICENSE']
authors = [{ name = 'Georgios Bekiaris', email = 'gbkfit@gmail.com' }]
requires-python = '>=3.12'
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: C++',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy'
]
dependencies = [
    'astropy',
    'matplotlib',
    'numpy',
    'pandas',
    'ruamel.yaml',
    'scikit-image',
    'scipy'
]

[project.optional-dependencies]
cuda = ['cupy-cuda12x']
dynesty = ['dynesty']
emcee = ['emcee']
lmfit = ['lmfit']
gui = ['PySide6']

[project.urls]
Homepage = 'https://github.com/bek0s/gbkfit'
Documentation = 'https://gbkfit.readthedocs.io'

[project.scripts]
gbkfit-cli = 'gbkfit.apps.cli:main'

[project.gui-scripts]
gbkfit-gui = 'gbkfit.apps.gui:main'

[dependency-groups]
test = ['pytest']
dev = [{ include-group = 'test' }]

[tool.scikit-build]
minimum-version = 'build-system.requires'
build-dir = 'build/{wheel_tag}'
wheel.packages = ['src/gbkfit']
sdist.include = ['src/gbkfit/_version.py']

[[tool.dynamic-metadata]]
provider = 'scikit_build_core.metadata.setuptools_scm'

[tool.setuptools_scm]
version_file = 'src/gbkfit/_version.py'
version_file_template = '__version__ = "{version}"'
