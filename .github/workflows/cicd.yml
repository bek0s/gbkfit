name: cicd

# Builds and tests the wheels for every supported platform (the Linux and
# Windows wheels include the CUDA module), and publishes to (Test)PyPI on
# a release.
#
# To build gbkfit locally, there is no need to replicate any of this; see
# docs/source/install.rst (in short: `pip install .`). The wheel settings
# used here (Python versions, tests, etc.) live under [tool.cibuildwheel]
# in pyproject.toml.

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: pipx run ruff check

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64 and aarch64, macOS arm64, Windows x86_64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm needs the history for the version
    - name: install OpenMP (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install libomp
        echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
    - name: install CUDA (Windows)
      # On Linux, CUDA is installed inside the build container instead
      # (see [tool.cibuildwheel.linux] in pyproject.toml)
      if: runner.os == 'Windows'
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.9.1'
        method: network
        sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
    - uses: pypa/cibuildwheel@v4.3.0
    - uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - run: pipx run build --sdist
    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    # Requires a "Trusted Publisher" for this repository and workflow on
    # (Test)PyPI, and a GitHub environment with the same name.
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
