gmodels:
- type: kinematics_3d
  components:
  - type: mcdisk
    cflux: 0.0001
    loose: false
    tilted: false
    rnmin: 0
    rnmax: 20
    rnsep: 2
    bptraits: {type: exponential}
    bhtraits: {type: sech2}
    vptraits: {type: tan_arctan}
    dptraits: {type: uniform}
observations:
- driver: {type: host}
  observable:
    type: scube
    size: [48, 48, 50]
    step: [1, 1, 10]
  instrument:
    psf: {type: gauss, sigma: 1.5}
    lsf: {type: gauss, sigma: 15.0}
params:
  properties: {vsys: 0, xpos: 0.5, ypos: -1.0, posa: 30, incl: 60, bpt_a: 1, bpt_s: 5,
    bht_s: 1, vpt_rt: 3, vpt_vt: 180, dpt_a: 20}
