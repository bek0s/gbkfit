version: 3
driver: {type: host}
galaxies:
- components:
  - type: disk
    loose: false
    tilted: false
    rnmin: 0
    rnmax: 20
    rnsep: 2
    density:
      ptraits: {type: exponential}
      htraits: {type: sech2, zmax: 8}
    kinematics:
      type: traits
      vptraits: {type: arctan, direction: tan}
      dptraits: {type: uniform}
    emission: {type: lines}
observations:
- type: sky
  line_of_sight: {type: grid}
  observable:
    type: pixel_spectra
    size: [48, 48, 50]
    step: [1, 1, 10]
  instrument:
    psf: {type: gauss, sigma: 1.5}
    lsf: {type: gauss, sigma: 15.0}
params:
  properties: {vsys: 0, xpos: 0.5, ypos: -1.0, posa: 30, incl: 60, pt_a: 1, pt_s: 5,
    ht_s: 1, vpt_rt: 3, vpt_vt: 180, dpt_a: 20}
