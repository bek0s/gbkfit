# mcdisk_cube: A thick Monte Carlo disk of clouds of a fixed seed in a cube, float64, on a grid.
# (written by make_golden.py; do not edit)
version: 10
driver: {type: host}
galaxies:
- components:
  - type: thick_disk
    loose: false
    tilted: false
    rnodes: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    rptraits: {type: exponential}
    vptraits: {type: arctan, direction: tan}
    dptraits: {type: uniform}
    emission: {type: lines}
    clouds: {cflux: 0.0001, seed: 7}
    rhtraits: {type: sech2, zmax: 4}
observations:
- type: sky
  data:
    type: pixel_spectra
    step: [0.8, 0.8]
    rpix: [11.5, 11.5]
    rval: [0, 0]
    rota: 0
    spectral: {step: 15.0, rpix: 19.5, rval: 0.0}
    data: observation0_spectra_d.fits
    error: 0.00015
  dtype: float64
  line_of_sight:
    type: grid
    depth: {extent: galaxy, step: null}
  foreground: {lens: null}
  instrument:
    primary_beam: null
    psf: {type: gauss, sigma: 0.6, ratio: 1.0, posa: 0.0}
    lsf: {type: gauss, sigma: 20.0 km s-1}
  observable: {type: pixel_spectra, smooth_weights: false, median_size: null}
  oversampling: [1, 1, 1]
  fft_dtype: float64
likelihoods: {type: gauss, weights: 1.0, missing_residual: null, white_floor: 0.01}
params:
  properties:
    xpos: 0.21
    ypos: -0.33
    posa: {value: 43, min: 0, max: 90}
    incl: {value: 50, min: 10, max: 80}
    vsys: {value: 6, min: -50, max: 50}
    rpt_a: 1
    rpt_s: 2.7
    vpt_rt: 1.7
    vpt_vt: {value: 140, min: 50, max: 300}
    dpt_a: {value: 30, min: 5, max: 80}
    rht_s: {value: 0.6, min: 0.1, max: 2}
