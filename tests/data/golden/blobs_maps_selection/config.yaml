# blobs_maps_selection: The moment maps of a disk whose density is an exponential, three blobs (a mixture) and a map of 4 x 4 cells, within a range of radii and of azimuths (selection traits).
# (written by make_golden.py; do not edit)
driver: {type: host}
galaxies:
- components:
  - type: smdisk
    loose: false
    tilted: false
    rnodes: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    density:
      ptraits:
      - {type: exponential}
      - {type: mixture_exponential, nblobs: 3}
      - type: map
        size: [4, 4]
        step: 2
    kinematics:
      vptraits: {type: arctan, direction: tan}
      dptraits: {type: uniform}
    emission: {type: lines}
    sptraits:
    - {type: rrange}
    - {type: azrange}
observations:
- type: sky
  data:
    step: [0.6, 0.6]
    rpix: [11.5, 11.5]
    rval: [0, 0]
    rota: 0
    moment0: {data: observation0_moment0_d.fits, error: observation0_moment0_e.fits}
    moment1: {data: observation0_moment1_d.fits, mask: observation0_moment1_m.fits,
      error: observation0_moment1_e.fits}
    moment2: {data: observation0_moment2_d.fits, mask: observation0_moment2_m.fits,
      error: observation0_moment2_e.fits}
  likelihood: {type: gaussian, weights: 1.0, missing_residual: 3.0, white_floor: 0.01}
  line_of_sight: {type: flat}
  foreground: {lens: null}
  instrument:
    primary_beam: null
    psf: {type: gauss, sigma: 0.6, ratio: 1.0, posa: 0.0}
    lsf: {type: gauss, sigma: 20}
  observable: {type: pixel_moments, mask_cutoff: 0.03, spec_size: 60, spec_step: 10,
    spec_rval: 0, spec_rest: null, spec_medium: null, spec_convention: null, method: moments,
    median_size: null}
  scale: [1, 1]
  dtype: float64
  fft_dtype: float64
params:
  properties:
    xpos: 0.21
    ypos: -0.33
    posa: {value: 43, min: 0, max: 90}
    incl: {value: 50, min: 10, max: 80}
    vsys: {value: 6, min: -50, max: 50}
    pt_a: 1
    pt_s: 2.7
    vpt_rt: 1.7
    vpt_vt: {value: 140, min: 50, max: 300}
    dpt_a: {value: 30, min: 5, max: 80}
    pt1_r: [2, 4, 5.5]
    pt1_t: [30, 150, 260]
    pt1_a:
    - {value: 0.6, min: 0, max: 5}
    - 0.6
    - 0.5
    pt1_s: [0.6, 0.8, 0.6]
    pt1_q: [0.6, 0.8, 1]
    pt1_p: [0, 30, 0]
    pt2_a: [0.05, 0.1, 0.1, 0.05, 0.1, 0.2, 0.2, 0.1, 0.1, 0.2, 0.35, 0.1, 0.05,
      0.1, 0.1, 0.05]
    spt_rmin: 0.5
    spt_rmax: 7.2
    spt1_p: 10
    spt1_s: 300
