# blobs_maps_selection: The moment maps of a disk whose density is an exponential, three blobs (a mixture) and a map of 4 x 4 cells, within a range of radii and of azimuths (selection traits).
# (written by make_golden.py; do not edit)
version: 10
driver: {type: host}
galaxies:
- components:
  - type: thin_disk
    loose: false
    tilted: false
    rnodes: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    rptraits:
    - {type: exponential}
    - {type: mixture_exponential, nblobs: 3}
    - type: map
      size: [4, 4]
      step: 2
    vptraits: {type: arctan, direction: tan}
    dptraits: {type: uniform}
    emission: {type: lines}
    sptraits:
    - {type: rrange}
    - {type: azrange}
observations:
- type: sky
  data:
    type: pixel_moments
    step: [0.6, 0.6]
    rpix: [11.5, 11.5]
    rval: [0, 0]
    rota: 0
    moment0: {data: observation0_moment0_d.fits, error: observation0_moment0_e.fits}
    moment1: {data: observation0_moment1_d.fits, mask: observation0_moment1_m.fits, error: observation0_moment1_e.fits}
    moment2: {data: observation0_moment2_d.fits, mask: observation0_moment2_m.fits, error: observation0_moment2_e.fits}
  dtype: float64
  line_of_sight: {type: flat}
  foreground: {lens: null}
  instrument:
    primary_beam: null
    psf: {type: gauss, sigma: 0.6, ratio: 1.0, posa: 0.0}
    lsf: {type: gauss, sigma: 20.0 km s-1}
  observable:
    type: pixel_moments
    spectral: {size: 60, step: 10.0, rpix: 29.5, rval: 0.0, convention: relativistic}
    flux_floor: 0.03
    method: moments
    median_size: null
  oversampling: [1, 1]
  fft_dtype: float64
likelihoods: {type: gauss, weights: 1.0, missing_residual: 3.0, white_floor: 0.01}
params:
  properties:
    xpos: 0.21
    ypos: -0.33
    posa: {value: 43, min: 0, max: 90}
    incl: {value: 50, min: 10, max: 80}
    vsys: {value: 6, min: -50, max: 50}
    rpt_a: 1
    rpt_s: 2.7
    vpt_rt: 1.7
    vpt_vt: {value: 140, min: 50, max: 300}
    dpt_a: {value: 30, min: 5, max: 80}
    rpt2_r: [2, 4, 5.5]
    rpt2_t: [30, 150, 260]
    rpt2_a:
    - {value: 0.6, min: 0, max: 5}
    - 0.6
    - 0.5
    rpt2_s: [0.6, 0.8, 0.6]
    rpt2_q: [0.6, 0.8, 1]
    rpt2_p: [0, 30, 0]
    rpt3_a: [0.05, 0.1, 0.1, 0.05, 0.1, 0.2, 0.2, 0.1, 0.1, 0.2, 0.35, 0.1, 0.05, 0.1, 0.1, 0.05]
    spt_rmin: 0.5
    spt_rmax: 7.2
    spt2_p: 10
    spt2_s: 300
