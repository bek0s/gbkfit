# thick_disk_transfer: A thick disk of gas whose lines absorb themselves and one of dust that dims the light behind it, seen in a cube through radiative transfer (the march along each line of sight), which line opacity needs.
# (written by make_golden.py; do not edit)
version: 24
driver: {type: host}
galaxies:
- components:
  - type: thick_disk
    loose: false
    tilted: false
    rnodes: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    rptraits: {type: exponential}
    vptraits: {type: arctan, direction: tan}
    dptraits: {type: uniform}
    light: {type: lines}
    name: gas
    rhtraits: {type: sech2, zmax: 4}
    opacity:
      type: line
      coefficients: {type: uniform}
  - type: thick_disk
    name: dust
    loose: false
    tilted: false
    rnodes: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    rptraits: {type: exponential}
    rhtraits: {type: sech2, zmax: 4}
    opacity: {type: dust}
observations:
- type: pixel_spectra
  smooth_weights: false
  median_size: null
  dtype: float64
  depth: {extent: galaxy, step: null, slab: null, subchannels: 1}
  source_grid: {step: auto, extent: auto}
  instrument:
    primary_beam: null
    psf: {type: gauss, sigma: 0.6, ratio: 1.0, posa: 0.0}
    lsf: {type: gauss, sigma: 20.0 km s-1}
  oversampling: [1, 1, 1]
  fft_dtype: float64
datasets:
- type: pixel_spectra
  step: [0.8, 0.8]
  rpix: [9.5, 9.5]
  rval: [0, 0]
  rota: 0
  spectral: {step: 20.0, rpix: 15.5, rval: 0.0}
  data: observation0_spectra_d.fits
  error: 0.00015
likelihoods: {type: gauss, weights: 1.0, missing_residual: null, white_floor: 0.01}
params:
  properties:
    gas_xpos: 0.21
    gas_ypos: -0.33
    gas_posa: {value: 43, min: 0, max: 90}
    gas_incl: {value: 50, min: 10, max: 80}
    gas_vsys: {value: 6, min: -50, max: 50}
    gas_rpt_a: 1
    gas_rpt_s: 2.7
    gas_vpt_rt: 1.7
    gas_vpt_vt: {value: 140, min: 50, max: 300}
    gas_dpt_a: {value: 30, min: 5, max: 80}
    gas_rht_s: {value: 0.6, min: 0.1, max: 2}
    gas_op_a: {value: 80, min: 0, max: 400}
    dust_xpos: 0.27
    dust_ypos: -0.38
    dust_posa: 40
    dust_incl: 55
    dust_rpt_a: {value: 0.3, min: 0, max: 2}
    dust_rpt_s: 3
    dust_rht_s: 0.5
