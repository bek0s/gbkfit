version: 3
driver: {type: host}
galaxies:
- components:
  - type: disk
    geometry: own
    name: disk
    loose: false
    tilted: false
    rnmin: 0
    rnmax: 10
    rnsep: 1
    density:
      ptraits: {type: exponential}
      htraits: {type: sech2, zmax: 3}
    kinematics:
      vptraits: {type: arctan, direction: tan}
      dptraits: {type: uniform}
    emission: {type: lines}
  - type: cone
    geometry: own
    name: outflow
    rnodes: [0.5, 2, 4, 6]
    density:
      ptraits: {type: exponential}
      htraits: {type: uniform, zmax: 1.5, rnodes: true}
    kinematics:
      vptraits: {type: uniform, direction: out}
      dptraits: {type: uniform}
    emission: {type: lines}
observations:
- type: sky
  line_of_sight: {type: grid}
  observable:
    type: pixel_spectra
    size: [32, 32, 41]
    step: [0.5, 0.5, 20]
  instrument:
    psf: {type: gauss, sigma: 1.0}
    lsf: {type: gauss, sigma: 30.0}
params:
  properties: {disk_vsys: 0, disk_xpos: 0, disk_ypos: 0, disk_posa: 30,
    disk_incl: 60, disk_pt_a: 1, disk_pt_s: 3, disk_ht_s: 0.5, disk_vpt_rt: 1,
    disk_vpt_vt: 200, disk_dpt_a: 30, outflow_vsys: 0, outflow_xpos: 0,
    outflow_ypos: 0, outflow_posa: 30, outflow_incl: 60, outflow_wall: 25,
    outflow_pt_a: 0.5, outflow_pt_s: 2,
    outflow_ht_s: [0.09, 0.35, 0.69, 1.04], outflow_vpt_vo: 300,
    outflow_dpt_a: 80}
