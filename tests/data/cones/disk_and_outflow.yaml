version: 8
driver: {type: host}
galaxies:
- components:
  - type: thick_disk
    name: disk
    loose: false
    tilted: false
    rnodes: {max: 10, sep: 1}
    rptraits: {type: exponential}
    rhtraits: {type: sech2, zmax: 3}
    vptraits: {type: arctan, direction: tan}
    dptraits: {type: uniform}
    emission: {type: lines}
  - type: cone
    name: outflow
    rnodes: [0, 2, 4, 6]
    rptraits: {type: exponential}
    rhtraits: {type: uniform, zmax: 1.5, nodewise: true}
    vptraits: {type: uniform, direction: out}
    dptraits: {type: uniform}
    emission: {type: lines}
observations:
- type: sky
  line_of_sight: {type: grid}
  observable:
    type: pixel_spectra
    size: [32, 32]
    step: [0.5, 0.5]
    spectral: {size: 41, step: 20, convention: relativistic}
  instrument:
    psf: {type: gauss, sigma: 1.0}
    lsf: {type: gauss, sigma: 30.0 km/s}
params:
  properties: {disk_vsys: 0, disk_xpos: 0, disk_ypos: 0, disk_posa: 30, disk_incl: 60, disk_rpt_a: 1, disk_rpt_s: 3, disk_rht_s: 0.5, disk_vpt_rt: 1, disk_vpt_vt: 200, disk_dpt_a: 30, outflow_vsys: 0, outflow_xpos: 0, outflow_ypos: 0, outflow_posa: 30, outflow_incl: 60, outflow_wall: 25, outflow_rpt_a: 0.5, outflow_rpt_s: 2, outflow_rht_s: [0.09, 0.35, 0.69, 1.04], outflow_vpt_vo: 300, outflow_dpt_a: 80}
